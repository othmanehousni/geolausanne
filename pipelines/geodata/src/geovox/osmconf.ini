# GDAL OSM driver configuration used by geovox (derived from GDAL's default osmconf.ini).
# Only the tags needed to classify surfaces, build bridges and seed places are promoted
# to columns; everything else stays in other_tags.

closed_ways_are_polygons=aeroway,amenity,boundary,building,building:part,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,water,waterway=riverbank,highway=platform,public_transport=platform,area:highway,man_made=bridge,man_made=pier
report_all_nodes=no
report_all_ways=no
tags_format=json

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,amenity,shop,cuisine,diet:halal,natural,tourism,addr:street,addr:housenumber,addr:postcode,addr:city,website,contact:website,phone,contact:phone,opening_hours,denotation,leaf_type
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway,railway,waterway,bridge,tunnel,layer,width,lanes,surface,service,area,covered,man_made,level
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,amenity,building,highway,area:highway,landuse,leisure,man_made,natural,water,waterway,place,surface,parking,sport,tourism,layer,bridge,tunnel,location,diet:halal,cuisine,shop
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
