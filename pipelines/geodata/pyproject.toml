[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geovox"
version = "1.0.0"
description = "Offline geodata pipeline that turns swisstopo + OpenStreetMap data into a streamed voxel Lausanne (GLB tiles + manifest)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "numba>=0.61",
  "rasterio>=1.4",
  "pyogrio>=0.10",
  "shapely>=2.0",
  "pyproj>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geovox = "geovox.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
