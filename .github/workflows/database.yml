name: Database migrations

# Applies supabase/migrations to the hosted Supabase project: automatically
# when a push to main changes them (after the pgTAP suite passes on a fresh
# database), or by hand (Actions → Database migrations → Run workflow), which
# can also load the seed on the first launch.
# Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD.
# Variable: SUPABASE_PROJECT_REF.
# Without them the workflow says so and stops: nothing is deployed.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:
    inputs:
      seed:
        description: Also load supabase/seed.sql (OpenStreetMap halal places; first launch only)
        type: boolean
        default: false

permissions:
  contents: read

# one deployment at a time, never cancelled half-way
concurrency:
  group: database-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Migrations + pgTAP on a fresh database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: PostgreSQL 16 with PostGIS and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-postgis-3 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"
      - name: Apply migrations and run the pgTAP suite
        run: bash scripts/test-db.sh
        env:
          PGHOST: /var/run/postgresql
          PGDATABASE: postgres

  push:
    name: Push to Supabase
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase is not configured (secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, variable SUPABASE_PROJECT_REF): nothing deployed. See docs/operations/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: supabase/setup-cli@v3
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest
      - name: Link the project
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        if: steps.config.outputs.ready == 'true'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Push migrations
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" ${{ inputs.seed && '--include-seed' || '' }}
