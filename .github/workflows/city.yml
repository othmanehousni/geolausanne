name: City tiles

# Builds the voxel city from swisstopo open data, the federal building
# register (FSO) and OpenStreetMap, and publishes it to Cloudflare Pages
# (free plan: 20 000 files and 25 MiB per file per deployment).
#
#   agglomeration  Lausanne and its 15 neighbours (default): 10 543 files,
#                  349 MB served, largest file 1.4 MB (the horizon). About
#                  25 min on 4 cores with the sources cached; plan 45-90 min
#                  on a runner, which first downloads ~1.8 GB.
#   lausanne       the municipality only: 6 483 files (190 MB before the
#                  colour model, about a quarter more now).
#   flon           the 1 km demo: 183 files, 14 MB (the committed copy).
#
# GitHub-hosted runner limits: this job stops after 240 min (GitHub's own
# limit is 6 h); about 14 GB of free disk, more after the clean-up step
# below, and the agglomeration needs ~8 GB at its peak (3.3 GB of sources,
# 4.6 GB of raw tiles before compression); memory peaks at ~3.5 GB with 4
# workers. Private repositories get 2 CPUs and 8 GB of RAM: it fits, block
# processing just takes about twice as long.
# Secrets: CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID.
# Variable: CF_PAGES_PROJECT (default "geolausanne-city").
# Then set NEXT_PUBLIC_CITY_BASE_URL=https://<project>.pages.dev on the web app.

on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to build
        type: choice
        options: [agglomeration, lausanne, flon]
        default: agglomeration
      deploy:
        description: Deploy to Cloudflare Pages (otherwise keep an artifact)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Work directories
        run: |
          echo "CITY_OUT=$RUNNER_TEMP/city" >> "$GITHUB_ENV"
          echo "CITY_CACHE=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
      - name: Free disk space (the agglomeration needs ~8 GB of sources and raw tiles)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: GDAL and osmium command line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin osmium-tool
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipelines/geodata/requirements.lock
      - run: pip install -r pipelines/geodata/requirements.lock -e pipelines/geodata
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build tiles
        working-directory: pipelines/geodata
        run: python -m geovox build --area ${{ inputs.area }} --out "$CITY_OUT" --cache "$CITY_CACHE" --workers 4
      - name: Build horizon
        working-directory: pipelines/geodata
        run: python -m geovox horizon --out "$CITY_OUT"
      - name: Compress (meshopt + gzip) and add CDN headers
        run: |
          bun run city:compress "$CITY_OUT"
          cp pipelines/geodata/cdn/_headers "$CITY_OUT/_headers"
          du -sh "$CITY_OUT"
          find "$CITY_OUT" -type f | wc -l
      - name: Deploy to Cloudflare Pages
        if: inputs.deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.CITY_OUT }} --project-name=${{ vars.CF_PAGES_PROJECT || 'geolausanne-city' }} --branch=main --commit-dirty=true
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.deploy }}
        with:
          name: city-${{ inputs.area }}
          path: ${{ env.CITY_OUT }}
          retention-days: 3
